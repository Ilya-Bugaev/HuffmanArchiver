name: Build and lint
on: [push, pull_request]
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format-18 clang-tidy-18

      - name: Check format
        run: |
          find . -path ./build -prune -o -type f \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format-18 --style=file --dry-run -Werror

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run clang-tidy
        run: |
          find src -type f -name '*.c' -print0 \
            | xargs -0 --no-run-if-empty clang-tidy-18 -p build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
